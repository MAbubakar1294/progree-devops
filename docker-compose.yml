
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: progree-devops:1.0
    ports:
      - "5000:5000"
    environment:
      APP_ENV: production
      PORT: "5000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
