apiVersion: apps/v1
kind: Deployment
metadata:
  name: progree-devops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: progree-devops
  template:
    metadata:
      labels:
        app: progree-devops
    spec:
      containers:
        - name: flask-app
          image: progree-devops:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20
